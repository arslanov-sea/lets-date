<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Свидание?</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <section class="screen">
      <h1 class="question">Пойдёшь со мной на свидание?</h1>
      <div class="button-row">
        <button class="btn btn-yes" id="btn-yes" type="button">Да</button>
        <button class="btn btn-no" id="btn-no" type="button">Нет</button>
      </div>
    </section>
  </main>

  <script src="js/tracking.js"></script>
  <script src="js/dodge.js"></script>
  <script>
    document.getElementById("btn-yes").addEventListener("click", () => {
      markNavigatingForward();
      window.location.href = "date.html";
    });
  </script>
</body>
</html>
